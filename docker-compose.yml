services:
  postgres:
    image: postgres:17
    container_name: launchcontrol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: launchcontrol
      POSTGRES_PASSWORD: launchcontrol
      POSTGRES_DB: launchcontrol
    ports:
      - "5432:5432"
    volumes:
      - launchcontrol_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  launchcontrol_postgres_data:
